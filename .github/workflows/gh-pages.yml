name: Build & Deploy

on:
  pull_request:
  push:
    branches:
      - master
  release:
    types: [released]
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ENV_USER_PASS: ${{ secrets.ENV_USER_PASS }}

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup PHP env 🏗
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Setup Node.js 🏗
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Directory 📦
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Cache pnpm store 💾
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install Contributors dependencies 💚
        run: pnpm install --frozen-lockfile

      - name: Install Traces project 💚
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        run: composer create-project prestashop/traces

      - name: Fetch repositories 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:fetch:repositories --ghtoken=${ENV_USER_PASS} --config="./config.dist.yml"

      - name: Fetch contributors 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:fetch:contributors --ghtoken=${ENV_USER_PASS} --config="./config.dist.yml"

      - name: Fetch merged pull requests 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:fetch:pullrequests:merged --ghtoken=${ENV_USER_PASS}

      - name: Generate new contributors 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:generate:newcontributors --limitNew=10 --config="./config.dist.yml"

      - name: Generate top companies 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:generate:topcompanies --ghtoken=${ENV_USER_PASS} --config="./config.dist.yml"

      - name: Fetch all pull requests 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:fetch:pullrequests:all --ghtoken=${ENV_USER_PASS}

      - name: Fetch issues 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:fetch:issues --ghtoken=${ENV_USER_PASS}

      - name: Generate top stats 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:generate:topstats --ghtoken=${ENV_USER_PASS} --config="./config.dist.yml"

      - name: Fetch security advisories 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:fetch:security-advisories --ghtoken=${ENV_USER_PASS}

      - name: Generate top security 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:generate:topsecurity --ghtoken=${ENV_USER_PASS} --config="./config.dist.yml"

      - name: Fetch QA label events 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:fetch:qaevents --ghtoken=${ENV_USER_PASS}

      - name: Generate top QA contributors 🔧
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        working-directory: ./traces
        run: php bin/console traces:generate:topqa --ghtoken=${ENV_USER_PASS} --config="./config.dist.yml"

      - name: Display Contributors without Companies 🔎
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        run: cat ./traces/gh_loginsWOCompany.json

      - name: Move JSON files into public/ 📁
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        run: |
          mkdir -p ./public
          mv ./traces/contributors.json ./public/
          mv ./traces/contributors_prs.json ./public/
          mv ./traces/topcompanies.json ./public/
          mv ./traces/topcompanies_prs.json ./public/
          mv ./traces/newcontributors.json ./public/
          mv ./traces/top_reviewers.json ./public/
          mv ./traces/top_issues.json ./public/
          mv ./traces/top_pullrequests.json ./public/
          mv ./traces/top_security.json ./public/
          mv ./traces/top_qa.json ./public/

      - name: Build Contributors Site 👷
        run: pnpm run build && pnpm run generate

      - name: Copy Nuxt output to dist for deploy 📦
        run: |
          rm -rf ./dist
          cp -r ./.output/public ./dist

      - name: Write CNAME file 🌐
        run: echo 'contributors.prestashop-project.org' > ./dist/CNAME

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: contributors.prestashop-project.org
