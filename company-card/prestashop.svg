<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-label="PrestaShop Top Company: PrestaShop">
  <title>PrestaShop Top Company — PrestaShop</title>
  <style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
    .sub { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #bbbbbb; }
    .tag { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #decde7; }
    .val { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #decde7; }
    .row-l { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dddddd; }
    .row-l--hi { fill: #decde7; }
    .row-v { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
    .row-v--hi { fill: #decde7; }
    .legend { font: 400 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #bbbbbb; }
    .foot { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5e5e5e; }
  </style>
  <rect width="560" height="260" rx="10" fill="#1d1d1b" stroke="#3f3f3d"/>
  <rect x="0" y="0" width="560" height="3" fill="#7b4fac"/>

  <defs><clipPath id="clip-avatar"><rect x="20" y="22" width="56" height="56" rx="28"/></clipPath></defs>
  <image x="20" y="22" width="56" height="56" clip-path="url(#clip-avatar)" href="data:image/jpeg;base64," preserveAspectRatio="xMidYMid slice"/>
  <rect x="20" y="22" width="56" height="56" rx="28" fill="none" stroke="#3f3f3d"/>

  <text x="90" y="44" class="name">PrestaShop</text>
  <text x="90" y="62" class="sub">78 contributors · 172 repos</text>
  <text x="90" y="78" class="sub">www.prestashop.com</text>

  <g transform="translate(428, 22)">
    <rect width="108" height="56" rx="6" fill="#ffd999"/>
    <text x="14" y="24" fill="#1d1d1b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.6">RANK</text>
    <text x="98" y="44" fill="#1d1d1b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" text-anchor="end">#1</text>
  </g>

  <text x="24" y="118" class="row-l">PRs merged</text>
  <line x1="140" y1="114" x2="520" y2="114" stroke="#3f3f3d" stroke-width="1" stroke-dasharray="1 4"/>
  <text x="536" y="118" class="row-v" text-anchor="end">19000</text>
  <text x="24" y="140" class="row-l">Commits</text>
  <line x1="140" y1="136" x2="520" y2="136" stroke="#3f3f3d" stroke-width="1" stroke-dasharray="1 4"/>
  <text x="536" y="140" class="row-v" text-anchor="end">91756</text>
  <text x="24" y="162" class="row-l">Share of all PRs</text>
  <line x1="140" y1="158" x2="520" y2="158" stroke="#3f3f3d" stroke-width="1" stroke-dasharray="1 4"/>
  <text x="536" y="162" class="row-v" text-anchor="end">64.18%</text>
  <text x="24" y="184" class="row-l">Years active</text>
  <line x1="140" y1="180" x2="520" y2="180" stroke="#3f3f3d" stroke-width="1" stroke-dasharray="1 4"/>
  <text x="536" y="184" class="row-v" text-anchor="end">14</text>

  <g>
    <clipPath id="clip-bar"><rect x="24" y="208" width="512" height="6" rx="3"/></clipPath>
    <g clip-path="url(#clip-bar)"><rect x="24" y="208" width="395" height="6" fill="#7b4fac"/><rect x="419" y="208" width="46" height="6" fill="#59af70"/><rect x="465" y="208" width="38" height="6" fill="#ffb000"/><rect x="503" y="208" width="33" height="6" fill="#5c92aa"/></g>
    <text x="24" y="228" class="legend"><tspan fill="#7b4fac">■</tspan> PrestaShop  <tspan fill="#59af70">■</tspan> prestashop.github.io  <tspan fill="#ffb000">■</tspan> autoupgrade  <tspan fill="#5c92aa">■</tspan> docs</text>
  </g>

  <text x="280" y="250" class="foot" text-anchor="middle">$ contributors.prestashop-project.org/company/prestashop</text>
</svg>